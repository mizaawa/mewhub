name: mewhub
description: "MewHub - an elegant multi-provider AI chat client for Android & iOS."
publish_to: 'none'

version: 1.5.0+10500

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # state & storage
  provider: ^6.1.5+1
  sqflite: ^2.4.5
  path_provider: ^2.1.6
  path: ^1.9.1
  flutter_secure_storage: ^11.2.0
  uuid: ^4.6.0

  # networking
  http: ^1.6.0
  xml: ">=6.5.0 <8.0.0"
  archive: ^4.0.0
  mime: ^2.0.0

  # rendering
  flutter_markdown_plus: ^1.0.12
  markdown: ^7.3.1
  flutter_math_fork: ^0.7.4
  re_highlight: ^0.0.3
  animations: ^3.0.0
  super_sliver_list: ^0.4.1
  fl_chart: ^1.3.0
  qr_flutter: ^4.1.0

  # device features
  image_picker: ^1.2.4
  file_picker: ^13.3.2
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
  mobile_scanner: ^7.5.0
  flutter_tts: ^4.2.5
  speech_to_text: ^7.5.0
  gal: ^2.3.3
  package_info_plus: ^10.2.2
  battery_plus: ^7.1.2
  flutter_local_notifications: ^22.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  sqflite_common_ffi: ^2.3.6

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/providers/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "assets/images/icon_bg.png"
  adaptive_icon_foreground: "assets/images/icon_fg.png"
  adaptive_icon_monochrome: "assets/images/icon_mono.png"
  adaptive_icon_foreground_inset: 0
