name: Release

# Builds installable packages and attaches them to a GitHub Release.
#
# Triggers:
#   - pushing a tag like v1.2.3 (creates the release automatically)
#   - manual run with an existing tag
#
# Required repository secrets for a stable Android signature:
#   ANDROID_KEYSTORE_BASE64   base64 of the .jks file
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (e.g. v1.0.0)'
        required: true

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.9'
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  meta:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - id: v
        shell: bash
        run: |
          tag="$TAG"
          version="${tag#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag '$tag' is not semver (expected vMAJOR.MINOR.PATCH[-suffix])"
            exit 1
          fi
          core="${version%%-*}"
          IFS=. read -r ma mi pa <<< "$core"
          build=$(( ma * 10000 + mi * 100 + pa ))
          pre=false
          [[ "$version" == *-* ]] && pre=true
          {
            echo "version=$core"
            echo "build=$build"
            echo "prerelease=$pre"
          } >> "$GITHUB_OUTPUT"
          echo "Building $tag -> version $core ($build), prerelease=$pre"

  test:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - name: Run tests (retry once on runner instability)
        shell: bash
        run: |
          set +e
          flutter test --reporter github --concurrency=1
          result=$?
          if [ "$result" -ne 0 ]; then
            echo "::warning::The first test run failed; retrying once to distinguish a transient runner failure."
            flutter test --reporter github --concurrency=1
            result=$?
          fi
          exit "$result"

  android:
    name: Android APK + AAB
    needs: [meta, test]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Gradle cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Restore signing key
        id: sign
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing Android signing secret: $name"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"
          echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"

      - name: Build
        shell: bash
        env:
          MEWHUB_KEYSTORE_PATH: ${{ steps.sign.outputs.path }}
          MEWHUB_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MEWHUB_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MEWHUB_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ needs.meta.outputs.version }}
          BUILD: ${{ needs.meta.outputs.build }}
        run: |
          # Same versionCode for split and universal APKs, so users can switch
          # between them without Android treating it as a downgrade.
          flutter build apk --release --split-per-abi --build-name="$VERSION" --build-number="$BUILD" \
            --android-project-arg=force-version-code-ignoring-abi=true
          flutter build apk --release --build-name="$VERSION" --build-number="$BUILD"
          flutter build appbundle --release --build-name="$VERSION" --build-number="$BUILD"
          mkdir -p dist
          out=build/app/outputs/flutter-apk
          cp "$out/app-arm64-v8a-release.apk"   "dist/MewHub-$VERSION-android-arm64-v8a.apk"
          cp "$out/app-armeabi-v7a-release.apk" "dist/MewHub-$VERSION-android-armeabi-v7a.apk"
          cp "$out/app-x86_64-release.apk"      "dist/MewHub-$VERSION-android-x86_64.apk"
          cp "$out/app-release.apk"             "dist/MewHub-$VERSION-android-universal.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/MewHub-$VERSION-android.aab"
          (cd dist && sha256sum ./*.apk ./*.aab > SHA256SUMS-android.txt)
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: android-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS IPA (unsigned)
    needs: [meta, test]
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Build
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          BUILD: ${{ needs.meta.outputs.build }}
        run: |
          flutter build ios --release --no-codesign --build-name="$VERSION" --build-number="$BUILD"
          mkdir -p dist Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "dist/MewHub-$VERSION-ios-unsigned.ipa" Payload
          (cd dist && shasum -a 256 ./*.ipa > SHA256SUMS-ios.txt)
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: ios-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish Android and iOS together
    needs: [meta, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}

      - uses: actions/download-artifact@v8
        with:
          name: android-dist
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: ios-dist
          path: dist

      - name: Release notes
        shell: bash
        run: |
          {
            if [ -f "docs/releases/v$VERSION.md" ]; then
              cat "docs/releases/v$VERSION.md"
              echo
            fi
            echo "## 📦 Downloads"
            echo
            echo "| Platform | File |"
            echo "|---|---|"
            echo "| Android, most phones (64-bit) | \`MewHub-$VERSION-android-arm64-v8a.apk\` |"
            echo "| Android, older 32-bit phones | \`MewHub-$VERSION-android-armeabi-v7a.apk\` |"
            echo "| Android, x86_64 devices | \`MewHub-$VERSION-android-x86_64.apk\` |"
            echo "| Android, any device | \`MewHub-$VERSION-android-universal.apk\` |"
            echo "| Android, Google Play upload | \`MewHub-$VERSION-android.aab\` |"
            echo "| iOS, unsigned (sign before installing) | \`MewHub-$VERSION-ios-unsigned.ipa\` |"
            echo
            echo "SHA-256 checksums: \`SHA256SUMS-android.txt\` and \`SHA256SUMS-ios.txt\`."
          } > notes.md

      - name: Verify packages and publish the complete draft
        working-directory: dist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          export LC_ALL=C
          prefix="./MewHub-$VERSION"
          android=("$prefix"-android-{arm64-v8a,armeabi-v7a,universal,x86_64}.apk "$prefix-android.aab")
          ios="$prefix-ios-unsigned.ipa"
          assets=("${android[@]}" "$ios" ./SHA256SUMS-{android,ios}.txt)
          for file in "${assets[@]}"; do
            if [[ ! -s "$file" ]]; then echo "::error::Missing or empty: $file"; exit 1; fi
          done
          # Check the manifests cover exactly the required packages, not just what happened to build.
          sha256sum "${android[@]}" | sort | diff -u <(sort SHA256SUMS-android.txt) -
          sha256sum "$ios" | diff -u SHA256SUMS-ios.txt -

          # A null release is different from a failed lookup. Never overwrite a public release on retry.
          state=$(gh api graphql -F owner='{owner}' -F repo='{repo}' -f tag="$TAG" \
            -f query='query($owner:String!, $repo:String!, $tag:String!) {
              repository(owner:$owner, name:$repo) { release(tagName:$tag) { isDraft } }
            }' --jq '.data.repository.release | if . == null then "new" elif .isDraft then "draft" else "published" end')
          case "$state" in
            new) gh release create "$TAG" --verify-tag --draft --prerelease="$PRERELEASE" \
                   --title "MewHub $TAG" --notes-file ../notes.md --generate-notes ;;
            draft) echo "Resuming the draft for $TAG" ;;
            *) echo "::error::Refusing to change a non-draft release: $TAG ($state)"; exit 1 ;;
          esac
          gh release upload "$TAG" "${assets[@]}" --clobber

          # Compare GitHub's digest for every uploaded asset (including the checksum files) before going public.
          { cat SHA256SUMS-{android,ios}.txt; sha256sum ./SHA256SUMS-{android,ios}.txt; } | sort > "$RUNNER_TEMP/expected.sha256"
          gh release view "$TAG" --json assets --jq '.assets[] | select(.state == "uploaded") | "\(.digest | ltrimstr("sha256:"))  ./\(.name)"' \
            | sort | diff -u "$RUNNER_TEMP/expected.sha256" -
          gh release edit "$TAG" --draft=false --prerelease="$PRERELEASE"
